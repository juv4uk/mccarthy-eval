name: Історична реконструкція — без Rust

on:
  pull_request:
    paths:
      - 'sens/**'
      - 'host/**'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/istorychna-chystota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  istorichna-chystota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Переконатися у відсутності Rust та його копій
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^sens/|^host/|\.rs$|(^|/)Cargo\.(toml|lock)$)'; then
            echo 'Знайдено сторонні Rust-файли або каталоги.'
            exit 1
          fi
          test ! -e sens
          test ! -e host
      - name: Виконати історичні перевірки Маккарті
        run: bash tests/historical-core/run.sh
