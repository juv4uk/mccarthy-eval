name: Історична реконструкція — без сторонньої копії SENS

on:
  pull_request:
    paths:
      - 'sens/**'
      - 'host/**'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/istorychna-chystota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  istorichna-chystota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Переконатися у відсутності копії SENS та Rust-runtime
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^sens/|^host/|(^|/)Cargo\.(toml|lock)$)'; then
            echo 'Знайдено сторонню копію SENS, host або Cargo manifest.'
            exit 1
          fi
          if git ls-files | grep -E '\.rs$' | grep -v -x 'tests/cml-bridge/cml-witness-driver.rs'; then
            echo 'Знайдено неузгоджений Rust-файл поза історичним CML-драйвером.'
            exit 1
          fi
          test ! -e sens
          test ! -e host
          test -f tests/cml-bridge/cml-witness-driver.rs
      - name: Виконати історичні перевірки Маккарті
        run: bash tests/historical-core/run.sh
